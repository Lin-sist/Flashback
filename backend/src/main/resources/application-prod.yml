spring:
  # 生产环境全部由环境变量注入，避免敏感信息落盘
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3000ms

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:7200000}

logging:
  level:
    root: info
    "[com.flashback]": info

app:
  time:
    zone-id: ${APP_TIME_ZONE_ID:Asia/Shanghai}
  ai:
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-v4-pro}
    # Type B：与 application.yml 同步。须小于前端 agentService 的 30000。
    timeout-millis: ${AI_TIMEOUT_MILLIS:20000}
    real-mode-mock-enabled: ${AI_REAL_MODE_MOCK_ENABLED:false}
