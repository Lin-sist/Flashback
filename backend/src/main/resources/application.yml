spring:
  application:
    name: flashback-backend
  profiles:
    # 本地直接启动时默认使用 dev；线上仍可通过环境变量或启动参数覆盖。
    default: dev

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.flashback.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

app:
  time:
    # 业务时区，避免依赖部署机默认时区导致解锁与时间轴偏移
    zone-id: Asia/Shanghai
  ai:
    # M4 accepted provider contract. Secrets are injected backend-side only.
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-v4-pro}
    timeout-millis: ${AI_TIMEOUT_MILLIS:10000}
    real-mode-mock-enabled: ${AI_REAL_MODE_MOCK_ENABLED:false}
    fallback:
      writing-prompts:
        - 你此刻最担心的是什么？
        - 如果三个月后回看现在，你希望自己记住什么？
        - 今天最想先推进的一件小事是什么？
      summary: 建议先把当前状态整理成一句简短总结
      confusion: 待补充
      emotion: 待整理
      core-question: 暂无
      desired-outcome: 暂无
  storage:
    provider: ${STORAGE_PROVIDER:qiniu}
    qiniu:
      access-key: ${QINIU_ACCESS_KEY:}
      secret-key: ${QINIU_SECRET_KEY:}
      bucket: ${QINIU_BUCKET:}
      region: ${QINIU_REGION:}
      private-domain: ${QINIU_PRIVATE_DOMAIN:}
      upload-token-ttl-seconds: ${QINIU_UPLOAD_TOKEN_TTL_SECONDS:600}
      download-url-ttl-seconds: ${QINIU_DOWNLOAD_URL_TTL_SECONDS:600}
      key-prefix: ${QINIU_KEY_PREFIX:flashback}
  media:
    max-image-count-per-record: 9
    max-voice-count-per-record: 9
    max-file-size-bytes: 41943040
    max-total-size-bytes-per-record: 314572800
  wechat:
    mini-program:
      app-id: ${WECHAT_MINI_PROGRAM_APP_ID:}
      secret: ${WECHAT_MINI_PROGRAM_SECRET:}
      code2-session-url: ${WECHAT_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
      access-token-url: ${WECHAT_ACCESS_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
      subscribe-message-send-url: ${WECHAT_SUBSCRIBE_MESSAGE_SEND_URL:https://api.weixin.qq.com/cgi-bin/message/subscribe/send}
      timeout-millis: ${WECHAT_CODE2SESSION_TIMEOUT_MILLIS:5000}
      unlock-reminder-template-id: ${WECHAT_UNLOCK_REMINDER_TEMPLATE_ID:}
      unlock-reminder-page: ${WECHAT_UNLOCK_REMINDER_PAGE:pages/record-detail/index}
      unlock-reminder-thing-key: ${WECHAT_UNLOCK_REMINDER_THING_KEY:thing1}
      unlock-reminder-time-key: ${WECHAT_UNLOCK_REMINDER_TIME_KEY:time2}
