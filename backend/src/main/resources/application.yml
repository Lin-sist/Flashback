spring:
  application:
    name: flashback-backend
  profiles:
    # 本地直接启动时默认使用 dev；线上仍可通过环境变量或启动参数覆盖。
    default: dev

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.flashback.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

app:
  time:
    # 业务时区，避免依赖部署机默认时区导致解锁与时间轴偏移
    zone-id: Asia/Shanghai
  agent:
    # C1 Agent Runtime。复用 app.ai 的 provider 与 secret，不新增凭证字段。
    max-turns-per-session: ${AGENT_MAX_TURNS_PER_SESSION:8}
    max-reply-chars: ${AGENT_MAX_REPLY_CHARS:120}
    resilience:
      # C8：一次 Agent HTTP 编排共享的 provider-work 总预算，必须小于前端 30000ms。
      provider-work-timeout-millis: ${AGENT_PROVIDER_WORK_TIMEOUT_MILLIS:24000}
    max-user-input-chars: ${AGENT_MAX_USER_INPUT_CHARS:1000}
    context-message-window: ${AGENT_CONTEXT_MESSAGE_WINDOW:12}
    draft-excerpt-chars: ${AGENT_DRAFT_EXCERPT_CHARS:300}
    # C2 Agent Tool Calling。走 provider 原生 function calling，无自研协议降级。
    tool-calling-enabled: ${AGENT_TOOL_CALLING_ENABLED:true}
    # strict mode 需 provider 的 beta 端点；未配地址时启用即视为配置错误，不静默降级。
    strict-mode-enabled: ${AGENT_STRICT_MODE_ENABLED:false}
    strict-mode-base-url: ${AGENT_STRICT_MODE_BASE_URL:}
    # 已确认支持 function calling 的 model；不得假设任意 provider / model 都支持。
    function-calling-models: ${AGENT_FUNCTION_CALLING_MODELS:deepseek-v4-pro,deepseek-v4-flash}
    # 以下两项 strict mode 无法表达（不支持 maxLength / maxItems），故由后端校验。
    max-tool-content-chars: ${AGENT_MAX_TOOL_CONTENT_CHARS:300}
    max-tool-tag-ids: ${AGENT_MAX_TOOL_TAG_IDS:5}
    tool-outcome-window: ${AGENT_TOOL_OUTCOME_WINDOW:3}
    # C3 Agent Memory Retrieval。只做标签 + 时间窗 + 说明性字段匹配，
    # 不加全文索引、不引外部引擎、默认不匹配记录正文。无新增凭证字段。
    memory:
      # 关闭时行为等价于引入记忆之前，且后端会留痕说明未生效（不静默表现为无命中）。
      enabled: ${AGENT_MEMORY_ENABLED:true}
      max-fragments: ${AGENT_MEMORY_MAX_FRAGMENTS:3}
      max-fragment-chars: ${AGENT_MEMORY_MAX_FRAGMENT_CHARS:120}
      lookback-months: ${AGENT_MEMORY_LOOKBACK_MONTHS:24}
      cue-message-window: ${AGENT_MEMORY_CUE_MESSAGE_WINDOW:3}
      min-keyword-length: ${AGENT_MEMORY_MIN_KEYWORD_LENGTH:2}
      max-keywords: ${AGENT_MEMORY_MAX_KEYWORDS:6}
    # C3b 友人回看对话。无阶段机、无工具、无素材；轮次上限比写作引导更短。
    review:
      max-turns-per-session: ${AGENT_REVIEW_MAX_TURNS:6}
      record-excerpt-chars: ${AGENT_REVIEW_RECORD_EXCERPT_CHARS:400}
    # C5 决策轨迹。工程向、不面向用户；只有开关与保留期，无采样率（design 决策 3）。
    # 关闭时留痕说明未生效，不静默表现为轨迹无数据。无新增凭证字段。
    observability:
      enabled: ${AGENT_OBSERVABILITY_ENABLED:true}
      # 供手动清理脚本使用；本刀不引入定时任务。0 表示不清理（非「删除全部」）。
      retention-days: ${AGENT_OBSERVABILITY_RETENTION_DAYS:90}
  ai:
    # M4 accepted provider contract. Secrets are injected backend-side only.
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-v4-pro}
    # Type B 修复：原值 10000 与前端默认超时相等，导致前端总是先断，
    # 用户看到 request: fail timeout 而不是后端的 UNAVAILABLE / FAILED 显式态。
    # C5 闸门 3 实测 provider max 8467ms，10 秒只剩 1.5 秒余量。
    # 提到 20000 留够余量，且**必须小于前端的 30000**——
    # 超时要先发生在后端，才能把显式失败语义交还给用户。
    timeout-millis: ${AI_TIMEOUT_MILLIS:20000}
    real-mode-mock-enabled: ${AI_REAL_MODE_MOCK_ENABLED:false}
    fallback:
      writing-prompts:
        - 你此刻最担心的是什么？
        - 如果三个月后回看现在，你希望自己记住什么？
        - 今天最想先推进的一件小事是什么？
      summary: 建议先把当前状态整理成一句简短总结
      confusion: 待补充
      emotion: 待整理
      core-question: 暂无
      desired-outcome: 暂无
  storage:
    provider: ${STORAGE_PROVIDER:qiniu}
    qiniu:
      access-key: ${QINIU_ACCESS_KEY:}
      secret-key: ${QINIU_SECRET_KEY:}
      bucket: ${QINIU_BUCKET:}
      region: ${QINIU_REGION:}
      private-domain: ${QINIU_PRIVATE_DOMAIN:}
      upload-url: ${QINIU_UPLOAD_URL:}
      upload-token-ttl-seconds: ${QINIU_UPLOAD_TOKEN_TTL_SECONDS:600}
      download-url-ttl-seconds: ${QINIU_DOWNLOAD_URL_TTL_SECONDS:600}
      key-prefix: ${QINIU_KEY_PREFIX:flashback}
    # S3 Signature V4 compatibility path (AWS S3 / MinIO / compatible OSS or COS mode).
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      session-token: ${S3_SESSION_TOKEN:}
      bucket: ${S3_BUCKET:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
      upload-token-ttl-seconds: ${S3_UPLOAD_TOKEN_TTL_SECONDS:600}
      download-url-ttl-seconds: ${S3_DOWNLOAD_URL_TTL_SECONDS:600}
      key-prefix: ${S3_KEY_PREFIX:flashback}
  media:
    max-image-count-per-record: 9
    max-voice-count-per-record: 9
    max-file-size-bytes: 41943040
    max-total-size-bytes-per-record: 314572800
  wechat:
    mini-program:
      app-id: ${WECHAT_MINI_PROGRAM_APP_ID:}
      secret: ${WECHAT_MINI_PROGRAM_SECRET:}
      code2-session-url: ${WECHAT_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
      access-token-url: ${WECHAT_ACCESS_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
      subscribe-message-send-url: ${WECHAT_SUBSCRIBE_MESSAGE_SEND_URL:https://api.weixin.qq.com/cgi-bin/message/subscribe/send}
      timeout-millis: ${WECHAT_CODE2SESSION_TIMEOUT_MILLIS:5000}
      unlock-reminder-template-id: ${WECHAT_UNLOCK_REMINDER_TEMPLATE_ID:}
      unlock-reminder-page: ${WECHAT_UNLOCK_REMINDER_PAGE:pages/record-detail/index}
      unlock-reminder-thing-key: ${WECHAT_UNLOCK_REMINDER_THING_KEY:thing1}
      unlock-reminder-time-key: ${WECHAT_UNLOCK_REMINDER_TIME_KEY:time2}
