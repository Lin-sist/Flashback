spring:
  # 本地开发环境使用固定连接信息，便于快速启动与联调
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/flashback?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}

security:
  jwt:
    # base64 编码的 256bit+ 密钥，示例仅用于本地开发
    secret: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWY=
    expiration-millis: 7200000

logging:
  level:
    root: info
    "[com.flashback]": debug

app:
  ai:
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-v4-pro}
    # Type B：与 application.yml 同步。须小于前端 agentService 的 30000。
    timeout-millis: ${AI_TIMEOUT_MILLIS:20000}
    real-mode-mock-enabled: ${AI_REAL_MODE_MOCK_ENABLED:false}
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - https://localhost:*
      - https://127.0.0.1:*
