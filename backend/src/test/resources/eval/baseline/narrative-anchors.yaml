# C6 话术质量的人评锚点
#
# ⚠️ 本文件当前是**空的**。空 ≠ 该维度已覆盖。
#
# ── 它为什么空 ──────────────────────────────────────────────
# 填充锚点需要**真实 provider 的产出** + 人工评判，属闸门 3（外调授权）范围，
# 而 C6 申请的外调预算是 0（N8 / design 决策 9）。
#
# 本刀刻意只交付结构：把「语言质量靠人评锚定」这句承诺落成一个有位置的东西，
# 而不是让它停在一句没有落点的话上——半年后回头看，那会分不清是
# 「决定不做」还是「忘了做」。
#
# ── 它为什么不能用 Judge 填（D31，三条独立成立的理由）──────────
# 1. 隐私：日记原文送第二个模型打分属未授权外发，意味着**每跑一次评测都要走闸门 3**，
#    而「每次改动都能跑」是 C6 的核心价值，两者直接矛盾；
# 2. 预算：本项目真实调用的历史量级是「6 次 / 预算 10」，Judge 跑几十条用例即爆表；
# 3. 不可复现：同一份输入两次打分可能不同，违反架构宪法 §3.6 的「维度稳定」。
#
# 因此 C6 的诚实表述是：
#   **Eval 覆盖轨迹不变量与回归比对；语言质量靠真实探针小样本人评锚定，
#     没有假装用 Judge 覆盖它。**
#
# ── 建议的填充时机 ──────────────────────────────────────────
# 顺带在 **C7 `agent-reflection-loop` 的闸门 3** 做。理由是 C7 必然要真实联调
# 重写路径，同一批真实产出既能验「重写后是否更好」，又能当语言质量锚点，
# 比现在单独申请一轮外调更省。
#
# ── 填充时的格式 ────────────────────────────────────────────
# 每条锚点记录一次人工评判，只存**结构化评级与理由摘要**，不存回复原文：
#
#   anchors:
#     - anchorId: <唯一标识>
#       ratedBy: <评判人>
#       ratedAt: <日期>
#       promptVersion: <当时的 promptVersion>
#       policyVersion: <当时的 policyVersion>
#       stage: <EMOTION | CONFUSION | ... | REVIEW>
#       rating: <good | acceptable | stiff | off-tone>
#       reasonTag: <too-long | too-analytical | too-cold | leading | natural | ...>
#       # 注意：不写回复原文。锚点是「某版本在某阶段的语气评级」，
#       # 不是语料库。要复核具体那句话，去查对应 sessionId 的轨迹与消息。
#
# ── 隐私 ────────────────────────────────────────────────────
# 本文件入库，因此禁止写入用户日记原文、Agent 回复原文、secret 与本机绝对路径。
# reasonTag 用受控词表而非自由文本，正是为了避免有人顺手把原句粘进来。

anchors: []
