# C6 快照基线（入库）
#
# 这份文件的失败语义与不变量层**不同**：指标变化不一定是缺陷。
# 如果你刚改了引导话术、阈值或编排逻辑，变化可能完全合理——但它需要人看一眼。
#
# 更新规则（design 决策 3、4）：
#   1. 确认变化符合预期；
#   2. 手工更新 metrics；
#   3. **必须**同步更新 baselineNote，写明由哪一刀改的、为什么；
#   4. 跑一次，把报错信息里给出的 checksum 实际值填回来。
#
# 为什么没有 -Dupdate 自动重写开关：
#   有了它，「评测红了」的最短解决路径就从「停下来想想这个变化对不对」
#   变成「跑一下命令让它变绿」，整套框架会退化成一个耗时的空转。
#   手工编辑的摩擦在这里是特性，不是缺陷。
#
# checksum 由「metrics + baselineNote」共同派生：
#   只改数字不改说明会对不上，从而被测试拦住。那正是橡皮图章的形态。
#
# 隐私：本文件不含任何用例输入文本，全部字段是枚举短标识、计数、长度与比例。
#
# ── 本批基线的由来 ──────────────────────────────────────────────
# 全部由 C6 `agent-eval-framework` 定于 2026-07-31，此时：
#   promptVersion / policyVersion 为 C5 归档后的当前值（未做任何 prompt 或阈值改动）；
#   R2「引导话术生硬」尚未优化——**这正是本批基线的用途**：
#   它记录的是「优化之前长什么样」，使 R2 的改动第一次可被前后比对。
# 因此这批数字**不代表理想状态**，只代表当前状态。

