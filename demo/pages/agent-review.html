<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 和它聊聊那时候</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<style>
  /* ---- 页级微调：Agent 对话浮层·回看（蓝本：回看页/Agent 对话浮层.png）
     见证者＝带折角的小信纸卡＋来源小药丸；授权说明以排印安静化收次级。 ---- */
  .page { position: absolute; inset: 0; padding: 0 var(--page-x); }

  .brand-row { position: relative; margin-top: 54px; text-align: center; }
  .back { position: absolute; left: 0; top: -2px; width: 24px; height: 24px; color: var(--ink); opacity: .8; }
  .look-title { margin-top: 26px; text-align: center; font-size: 27px; font-weight: 400; letter-spacing: 0.1em; color: var(--ink); }
  .reader { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .reader .reader-text { font-size: 13.5px; font-weight: 300; letter-spacing: 0.1em; color: var(--ink-mid); }
  .look-card { margin-top: 22px; padding: 24px 24px 30px 28px; }
  .look-card .look-body { font-size: 15.5px; line-height: 2.0; }

  /* 对话底板 */
  .review-sheet { padding-bottom: 26px; }
  .chat-note.folded::after {
    content: ""; position: absolute; top: -0.5px; right: -0.5px;
    width: 14px; height: 14px;
    background: linear-gradient(to bottom left, var(--fold-page) 0 50%, var(--fold-shade) 50.5% 100%);
    box-shadow: -2px 2px 3px rgba(120, 100, 70, 0.16);
  }
  .permit-row { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
  .permit-row .t-meta { letter-spacing: 0.05em; }
  .switch { position: relative; flex: none; width: 34px; height: 19px; border-radius: 999px; background: rgba(158, 152, 144, 0.45); }
  .switch i { position: absolute; left: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: #FBF8F1; box-shadow: 0 1px 2px rgba(80, 65, 45, 0.25); }

  .send-row { margin-top: 10px; display: flex; align-items: center; gap: 12px; }
  .send-row .chat-input-bar { flex: 1; }
  .send-circle {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    display: grid; place-items: center; color: var(--ink-mid);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .send-circle { background: var(--glass-fallback); }
  }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">
    <header class="brand-row">
      <a class="back" href="look.html" aria-label="返回回看">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>
      </a>
      <span class="t-brand">时光回序</span>
    </header>

    <h2 class="look-title">“那天晚上的风”</h2>
    <div class="reader">
      <span class="seal">阅</span>
      <span class="reader-text">过去的你 · 写于半年前</span>
    </div>
    <article class="letter-card look-card">
      <span class="redline"></span>
      <p class="t-body look-body">搬家前夜，雨下得很大。我把阳台的花一棵一棵搬进屋里，想着明年它们会不会还记得这个阳台。</p>
    </article>
  </main>

  <span class="veil" aria-hidden="true"></span>

  <section class="chat-sheet review-sheet m-rise">
    <span class="chat-handle"></span>
    <a class="chat-close" href="look.html" aria-label="收起对话">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>
    </a>
    <p class="chat-kicker">回看对话</p>
    <h2 class="chat-title">和它聊聊那时候</h2>

    <div class="talk-body">
      <p class="chat-note folded">那一夜的雨声，好像替你把没说完的话慢慢收好了。</p>
      <p class="chat-note folded">你以为自己只是搬走，其实也在和那个阳台认真告别。<br>
        <a class="source-chip" href="records.html"><i></i>来源 · 城南旧书店的雨夜</a>
      </p>
      <p class="chat-note-user papered">原来那时候的我，已经比想象中更舍不得了。</p>
    </div>

    <footer>
      <div class="permit-row">
        <span class="t-meta">它只读取你允许的记录</span>
        <span class="switch" aria-hidden="true"><i></i></span>
      </div>
      <div class="send-row">
        <div class="chat-input-bar">
          <span class="ph">写下你想说的…</span>
        </div>
        <span class="send-circle" role="button" aria-label="发送">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.2 1.8L7 9M14.2 1.8L9.6 14.2 7 9 1.8 6.4z"/></svg>
        </span>
      </div>
    </footer>
  </section>

</div>

</body>
</html>
