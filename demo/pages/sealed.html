<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 封存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<style>
  /* ---- 页级微调：封存页（蓝本：概念图/封存页/V1.png，小修并入代码） ----
     修正一处：语音占位裸波形＋细线圆圈播放键（去灰底圆角容器）。
     全页禁倒计时数字与进度条；时间语法＝静态期待。融霜动效预留（motion.css .frost.is-thawing）。 */
  .page { position: absolute; inset: 0; padding: 0 var(--page-x); }

  .brand-row { margin-top: 54px; text-align: center; }
  .close { display: block; margin-top: 10px; width: 26px; height: 26px; color: var(--ink); opacity: .8; }

  .archive { margin-top: 20px; text-align: center; }
  .archive .a-line { font-size: 13px; font-weight: 300; letter-spacing: 0.18em; color: var(--ink-mid); }
  .archive .a-season { margin-top: 9px; }

  /* 霜卡：封印＋过去的你＋标题隔霜微透＋正文只剩墨影、边缘凝霜更重 */
  .sealed-card { margin-top: 26px; padding: 26px 26px 36px 28px; }
  .sealed-head { display: flex; align-items: center; gap: 12px; }
  .sealed-who { font-size: 12.5px; font-weight: 300; letter-spacing: 0.1em; color: var(--ink-mid); }
  .sealed-title { margin-top: 14px; padding-left: 38px; font-size: 20px; font-weight: 400; letter-spacing: 0.1em; color: var(--ink); }
  .sealed-body { margin-top: 18px; max-width: 272px; }

  /* 霜：上半留出「隔霜微透」带（封印与标题微透），下部愈重把正文压成墨影 */
  .sealed-card .frost {
    z-index: 3;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.85) 100%);
    box-shadow:
      inset 0 0 26px 10px rgba(255, 255, 255, 0.95),
      inset 0 0 5px 1px rgba(255, 255, 255, 0.9);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    -webkit-mask-image: linear-gradient(180deg, transparent 0 20%, rgba(0, 0, 0, 0.85) 34%, #000 44%);
    mask-image: linear-gradient(180deg, transparent 0 20%, rgba(0, 0, 0, 0.85) 34%, #000 44%);
  }

  /* 片段区在霜外：两缩略图＋裸波形（无灰底容器）＋细线圆圈播放键 */
  .fragments { margin-top: 30px; }
  .frag-row { margin-top: 14px; display: flex; align-items: center; gap: 10px; }
  .frag-row figure { position: relative; flex: none; width: 82px; height: 62px; box-shadow: 0 3px 8px rgba(120, 100, 70, 0.18); }

  .ph-sun {
    background:
      radial-gradient(24px 18px at 26% 78%, rgba(44, 36, 26, 0.5), transparent 72%),
      radial-gradient(16px 14px at 10% 55%, rgba(44, 36, 26, 0.4), transparent 72%),
      radial-gradient(12px 10px at 70% 88%, rgba(44, 36, 26, 0.35), transparent 72%),
      linear-gradient(90deg, transparent 0 32%, rgba(64, 52, 38, 0.4) 32% 35%, transparent 35%),
      linear-gradient(200deg, #F2D9AC 0%, #E0B584 42%, #A37F55 78%, #5E4A36 100%);
  }
  .ph-dusk { background: linear-gradient(180deg, #DDB99E 0%, #C69C8A 38%, #8F7768 66%, #4A3D34 100%); }
  .ph-dusk::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24px;
    background: #322820;
    clip-path: polygon(0 58%, 16% 34%, 40% 52%, 58% 16%, 80% 44%, 100% 26%, 100% 100%, 0 100%);
  }

  .voice { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .v-play {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(107, 101, 96, 0.5);
    display: grid; place-items: center;
  }
  .v-play i {
    display: block; margin-left: 2px;
    border-style: solid; border-width: 4.5px 0 4.5px 7px;
    border-color: transparent transparent transparent var(--ink-mid);
  }
  .wave { flex: 1; height: 28px; color: var(--ink-light); }

  /* 朱砂点状态行＋大号宋体静态期待（禁倒计时数字滚动/进度条） */
  .status-row { margin-top: 34px; display: flex; align-items: center; justify-content: center; gap: 9px; }
  .status-row i { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--vermilion); }
  .status-row span { font-size: 13px; font-weight: 300; letter-spacing: 0.12em; color: var(--ink-mid); }

  .expect {
    margin-top: 22px; text-align: center;
    font-size: 27px; font-weight: 400; letter-spacing: 0.1em; color: var(--ink);
  }

  .sealed-foot { position: absolute; left: 0; right: 0; bottom: 38px; text-align: center; }
  .foot-note { font-size: 12px; font-weight: 300; letter-spacing: 0.14em; color: var(--ink-light); }

  .d-2 { --rise-delay: 220ms; }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">

    <header class="brand-row"><span class="t-brand">时光回序</span></header>
    <a class="close" href="records.html" aria-label="返回我的记录">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>
    </a>

    <section class="archive">
      <p class="a-line">存档第 三〇 号 · 城南旧书店</p>
      <p class="a-line a-season">二〇二六年 · 秋季</p>
    </section>

    <article class="letter-card fold sealed-card m-rise">
      <div class="sealed-head">
        <span class="seal">封</span>
        <span class="sealed-who">过去的你 · 写于去年</span>
      </div>
      <h3 class="sealed-title">“那天晚上的风”</h3>
      <p class="t-body sealed-body">那天晚上的风很大，路灯把两个人的影子拉得很长。你说等风小一点再回去，我们就沿着河边慢慢地走，谁也没有提明天的事。</p>
      <span class="frost" aria-hidden="true"></span>
    </article>

    <section class="fragments m-rise d-2">
      <p class="t-meta-serif">当时留下的片段 · 2 项</p>
      <div class="frag-row">
        <figure class="ph-sun" role="img" aria-label="夕阳与树影（合成占位图）"></figure>
        <figure class="ph-dusk" role="img" aria-label="屋顶暮色（合成占位图）"></figure>
        <div class="voice">
          <span class="v-play"><i></i></span>
          <svg class="wave" viewBox="0 0 128 28" preserveAspectRatio="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
              <line x1="2" y1="11" x2="2" y2="17"/><line x1="6" y1="8" x2="6" y2="20"/><line x1="10" y1="10" x2="10" y2="18"/><line x1="14" y1="6" x2="14" y2="22"/>
              <line x1="18" y1="9" x2="18" y2="19"/><line x1="22" y1="4" x2="22" y2="24"/><line x1="26" y1="7" x2="26" y2="21"/><line x1="30" y1="2" x2="30" y2="26"/>
              <line x1="34" y1="5" x2="34" y2="23"/><line x1="38" y1="3" x2="38" y2="25"/><line x1="42" y1="4" x2="42" y2="24"/><line x1="46" y1="2" x2="46" y2="26"/>
              <line x1="50" y1="3" x2="50" y2="25"/><line x1="54" y1="6" x2="54" y2="22"/><line x1="58" y1="2" x2="58" y2="26"/><line x1="62" y1="5" x2="62" y2="23"/>
              <line x1="66" y1="4" x2="66" y2="24"/><line x1="70" y1="7" x2="70" y2="21"/><line x1="74" y1="5" x2="74" y2="23"/><line x1="78" y1="8" x2="78" y2="20"/>
              <line x1="82" y1="6" x2="82" y2="22"/><line x1="86" y1="9" x2="86" y2="19"/><line x1="90" y1="7" x2="90" y2="21"/><line x1="94" y1="10" x2="94" y2="18"/>
              <line x1="98" y1="8" x2="98" y2="20"/><line x1="102" y1="9" x2="102" y2="19"/><line x1="106" y1="10" x2="106" y2="18"/><line x1="110" y1="8" x2="110" y2="20"/>
              <line x1="114" y1="11" x2="114" y2="17"/><line x1="118" y1="9" x2="118" y2="19"/><line x1="122" y1="10" x2="122" y2="18"/><line x1="126" y1="11" x2="126" y2="17"/>
            </g>
          </svg>
        </div>
      </div>
    </section>

    <div class="status-row"><i></i><span>即将抵达，封印未解</span></div>

    <p class="expect">即将抵达 · 2027 年夏</p>

    <footer class="sealed-foot"><span class="foot-note">解锁后，过去的你会读到这封信</span></footer>

  </main>

</div>

</body>
</html>
