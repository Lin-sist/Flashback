<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 已保存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<style>
  /* ---- 页级微调：已保存承接态（指南 §5.3 ＋ brief §6.3；无定稿图） ---- */
  .page { position: absolute; inset: 0; padding: 0 var(--page-x); display: flex; flex-direction: column; }

  .done-head {
    margin-top: 92px; text-align: center;
    font-size: 19px; font-weight: 400; letter-spacing: 0.16em; text-indent: 0.16em; color: var(--ink);
  }

  /* 信卡：正文信卡化，落印在卡右下（信卡出现后落印） */
  .saved-card { margin-top: 52px; padding: 30px 26px 32px 30px; }
  .saved-card .s-title { font-size: 22px; font-weight: 400; letter-spacing: 0.1em; color: var(--ink); }
  .saved-card .t-body { margin-top: 18px; max-width: 268px; }
  .saved-card .s-time { margin-top: 28px; }
  .saved-card .seal { --stamp-delay: 720ms; position: absolute; right: 18px; bottom: 16px; }

  .more { margin-top: 42px; text-align: center; }

  /* Agent 参考开关：排印安静化，收次级（细线开关＋11px 元数据行）；余白留底 */
  .agent-note {
    margin-top: 96px; margin-bottom: 26px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .agent-switch {
    position: relative; flex: none;
    width: 30px; height: 18px; border-radius: 999px;
    border: 1px solid var(--ink-faint);
  }
  .agent-switch i {
    position: absolute; left: 2px; top: 2px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink-faint);
  }
  .agent-note .t-meta { letter-spacing: 0.06em; }

  .danger {
    align-self: center;
    font-size: 13px; font-weight: 300; letter-spacing: 0.22em; text-indent: 0.22em;
    color: var(--vermilion); opacity: 0.9;
  }

  .d-0 { --rise-delay: 0ms; }
  .d-1 { --rise-delay: 140ms; }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">

    <h1 class="done-head m-rise d-0">这一刻已经留下</h1>

    <article class="letter-card fold saved-card m-rise d-1">
      <span class="redline"></span>
      <h2 class="s-title">雨停之后</h2>
      <p class="t-body">傍晚下过一阵雨，窗边的风有一点凉。</p>
      <p class="t-meta-serif s-time">留下于 二零二六年 · 暮秋</p>
      <span class="seal m-stamp">封</span>
    </article>

    <div class="more"><a class="tlink" href="writing.html">继续补充</a></div>

    <div class="agent-note">
      <span class="agent-switch" aria-hidden="true"><i></i></span>
      <span class="t-meta">不再供参考 · 只代表当时，不代表现在</span>
    </div>

    <button class="danger">删除这条记录</button>

  </main>

</div>

</body>
</html>
