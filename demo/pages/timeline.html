<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 时光轴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<style>
  /* ---- 页级微调：时光轴（蓝本：概念图/时间轴/V1.png；节点语义在代码层纠正） ----
     节点语义：空心＝纯文字、实心墨点＝含媒体；「此时此刻」为朱砂点。
     条目形态分化：排印块（纯文字）/ 时刻卡（图片）/ 霜卡（封存）。 */
  .page { position: absolute; inset: 0; padding: 0 var(--page-x); }

  .top-row { position: relative; margin-top: 54px; height: 34px; display: flex; align-items: center; justify-content: center; }
  .top-row .chip { position: absolute; left: 0; }

  .tl-head { margin-top: 40px; }
  .tl-head h1 .t-h1a { font-size: 40px; }
  .tl-head h1 .t-h1b { font-size: 36px; }
  .tl-head h1 { line-height: 1.35; }
  .tl-head .t-sub { margin-top: 10px; font-size: 12.5px; letter-spacing: 0.02em; }

  /* 脊线＋节点：竖线随 .m-spine 生长；节点两态直接按内容语义静态呈现 */
  .spine-zone { position: relative; margin-top: 42px; padding-left: 34px; }
  .spine { position: absolute; left: 6px; top: 4px; bottom: 6px; width: 1.5px; background: rgba(158, 152, 144, 0.4); }
  .node-line { position: absolute; left: -34px; top: 2px; width: 14px; height: 14px; }
  .tl-node { display: block; width: 100%; height: 100%; border-radius: 50%; }
  .tl-node.hollow { background: transparent; border: 1px solid var(--ink-mid); }
  .tl-node.media  { background: var(--ink); border: 1px solid var(--ink); }
  .node-line.media { width: 12px; height: 12px; top: 3px; left: -33px; }
  .node-line.now { width: 10px; height: 10px; top: 4px; left: -32px; }
  .tl-node.now { background: var(--vermilion); }
  .tl-entry { position: relative; padding-bottom: 24px; }
  .tl-date { margin-bottom: 10px; }
  .tl-entry .text-block { padding-top: 0; max-width: 300px; }

  .tl-entry .moment-card { margin-top: 4px; }
  .tl-entry .moment-card .m-photo { height: 126px; }
  .tl-entry .moment-card .m-photo {
    background:
      radial-gradient(2px 2px at 18% 30%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(2.5px 2.5px at 36% 56%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(2px 2px at 55% 26%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(3px 3px at 70% 66%, rgba(255,255,255,.45), transparent 60%),
      radial-gradient(2px 2px at 84% 40%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(16px 13px at 24% 78%, rgba(226,168,102,.55), transparent 72%),
      radial-gradient(22px 16px at 46% 70%, rgba(233,186,124,.6), transparent 72%),
      radial-gradient(14px 12px at 66% 80%, rgba(216,154,91,.5), transparent 72%),
      linear-gradient(180deg, #6E7480 0%, #97836E 34%, #C8986A 56%, #7E6C58 78%, #4E463C 100%);
  }

  /* 霜卡（封存条目）：霜感对齐封存页；标题隔霜微透，封印霜上 */
  .tl-frost-card { display: block; padding: 18px 18px 18px 24px; }
  .tl-frost-card .frost {
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.72));
    box-shadow: inset 0 0 18px 6px rgba(255,255,255,.92);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  }
  .frost-lines { display: block; margin-top: 10px; }
  .frost-lines i { display: block; width: 86%; height: 8px; border-radius: 2px; background: rgba(107, 101, 96, 0.42); filter: blur(2px); }
  .frost-lines i + i { margin-top: 8px; width: 62%; }
  .tl-frost-card .frost-title {
    position: relative; font-size: 17px; font-weight: 400; letter-spacing: 0.08em; color: var(--ink);
  }
  .tl-frost-card .seal { position: absolute; right: 16px; top: 50%; margin-top: -14px; z-index: 4; }

  .d-1 { --rise-delay: 120ms; }
  .d-2 { --rise-delay: 260ms; }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">

    <header class="top-row">
      <span class="chip">筛选</span>
      <span class="t-brand">时光回序</span>
    </header>

    <section class="tl-head">
      <h1 style="line-height:1.3"><span class="t-h1a">时 间</span><br><span class="t-h1b">长 廊</span></h1>
      <p class="t-sub">在此处，凝视那些被封存的往昔，与尚未开启的明日。</p>
    </section>

    <section class="spine-zone">
      <span class="spine m-spine"></span>

      <div class="tl-entry">
        <span class="node-line now"><i class="tl-node now"></i></span>
        <p class="t-meta-serif" style="margin-top: 1px;">此时此刻</p>
      </div>

      <div class="tl-entry">
        <span class="node-line"><i class="tl-node hollow"></i></span>
        <div class="text-block m-rise d-1">
          <p class="t-meta-serif tl-date">八月三日</p>
          <p class="tb-text">傍晚下过一阵雨，<br>窗边的风有一点凉。</p>
        </div>
      </div>

      <div class="tl-entry">
        <span class="node-line media"><i class="tl-node media"></i></span>
        <a class="letter-card fold moment-card m-rise d-2" href="look.html" aria-label="雨停之后">
          <figure class="m-photo" role="img" aria-label="雨后窗面与暮色（合成占位图）"></figure>
          <div class="m-info"><p class="t-section">雨停之后</p></div>
        </a>
      </div>

      <div class="tl-entry" style="padding-bottom: 80px;">
        <span class="node-line"><i class="tl-node hollow"></i></span>
        <a class="letter-card tl-frost-card m-rise" href="sealed.html" aria-label="那天晚上的风，封存中">
          <p class="frost-title">“那天晚上的风”</p>
          <span class="frost-lines" aria-hidden="true"><i></i><i></i></span>
          <span class="frost" aria-hidden="true"></span>
          <span class="seal">封</span>
        </a>
      </div>

    </section>

  </main>

  <nav class="tabbar">
    <a class="tab" href="home.html">首页</a>
    <span class="tab active">时光轴</span>
    <a class="tab" href="user-center.html">个人中心</a>
  </nav>

</div>

</body>
</html>
