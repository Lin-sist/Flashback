<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 我的记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<style>
  /* ---- 页级微调：我的记录（蓝本：概念图/我的记录/V1.png；chips 安静化为文字态） ---- */
  .page { position: absolute; inset: 0; padding: 0 var(--page-x); }

  .nav-row { position: relative; margin-top: 54px; height: 30px; display: flex; align-items: center; justify-content: center; }
  .back { position: absolute; left: 0; display: inline-flex; align-items: center; gap: 7px; color: var(--ink); opacity: .85; }
  .back span { font-size: 14px; font-weight: 300; letter-spacing: 0.1em; }
  .nav-title { font-size: 15px; font-weight: 400; letter-spacing: 0.3em; text-indent: 0.3em; color: var(--ink); }

  /* 二级 Tab：记录 ｜ 篇章 */
  .seg-tabs { margin-top: 26px; display: flex; align-items: center; justify-content: center; gap: 26px; }
  .seg-tab { position: relative; font-size: 16px; font-weight: 400; letter-spacing: 0.2em; text-indent: 0.2em; color: var(--ink-light); padding-bottom: 8px; }
  .seg-tab.active { color: var(--ink); }
  .seg-tab.active::after { content: ""; position: absolute; left: 15%; right: 15%; bottom: 0; height: 1.5px; background: var(--vermilion); }
  .seg-div { width: 0.5px; height: 16px; background: var(--ink-faint); }

  .search { margin-top: 24px; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; border: 0.5px solid var(--hairline); border-radius: var(--radius-card); background: rgba(252, 249, 244, 0.6); color: var(--ink-light); }
  .search span { font-size: 13.5px; font-weight: 300; letter-spacing: 0.06em; }

  .filter-row { margin-top: 20px; display: flex; align-items: center; gap: 9px; }
  .f-chip { flex: none; white-space: nowrap; font-size: 12px; font-weight: 300; letter-spacing: 0.04em; color: var(--ink-mid); padding: 4px 2px; }
  .f-chip.active { border: 0.5px solid rgba(107, 101, 96, 0.55); border-radius: var(--radius-card); padding: 4px 9px; color: var(--ink); }
  .filter-row .f-right { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .filter-row .f-right .t-meta { font-size: 10px; letter-spacing: 0.02em; }
  .compose { white-space: nowrap; font-size: 12px; font-weight: 300; letter-spacing: 0.04em; color: var(--vermilion); }

  /* 档案信卡列表 */
  .rec-card { margin-top: 20px; padding: 22px 22px 18px 24px; display: block; }
  .rec-main { display: flex; gap: 16px; }
  .rec-ico { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(107, 101, 96, 0.5); display: grid; place-items: center; color: var(--ink-mid); }
  .rec-title { font-size: 18px; font-weight: 400; letter-spacing: 0.06em; color: var(--ink); }
  .rec-abs { margin-top: 9px; font-size: 13.5px; font-weight: 300; line-height: 1.7; letter-spacing: 0.03em; color: var(--ink-mid); }
  .rec-foot { margin-top: 16px; padding-top: 14px; border-top: 0.5px solid var(--hairline); display: flex; align-items: center; gap: 9px; }
  .rec-foot i { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--vermilion); }
  .rec-foot .st { font-size: 13px; font-weight: 300; letter-spacing: 0.1em; color: var(--ink-mid); }
  .rec-foot .eta { margin-left: auto; font-size: 12px; font-weight: 300; letter-spacing: 0.08em; color: var(--ink-light); }

  .d-1 { --rise-delay: 140ms; }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">

    <header class="nav-row">
      <a class="back" href="user-center.html" aria-label="返回个人中心">
        <svg width="9" height="16" viewBox="0 0 9 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1L1.5 8L8 15"/></svg>
        <span>返回</span>
      </a>
      <span class="nav-title">我的记录</span>
    </header>

    <nav class="seg-tabs">
      <span class="seg-tab active">记录</span>
      <span class="seg-div"></span>
      <a class="seg-tab" href="chapter.html">篇章</a>
    </nav>

    <div class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="7" cy="7" r="5.2"/><path d="M11 11l3.4 3.4"/></svg>
      <span>搜索标题或内容</span>
    </div>

    <div class="filter-row">
      <span class="f-chip active">全部</span>
      <span class="f-chip">已留下</span>
      <span class="f-chip">已封存</span>
      <span class="f-chip">已解锁</span>
      <span class="f-right">
        <span class="t-meta">共 18 份记录 ·</span>
        <a class="compose" href="chapter.html">组成篇章</a>
      </span>
    </div>

    <a class="letter-card fold rec-card m-rise d-1" href="sealed.html" aria-label="给二十岁生日的一封信，封存中">
      <div class="rec-main">
        <span class="rec-ico">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8.6" width="12" height="8.4" rx="1"/><path d="M6.8 8.6V6.4a3.2 3.2 0 0 1 6.4 0v2.2"/><circle cx="10" cy="12.6" r="1.1"/></svg>
        </span>
        <div>
          <p class="rec-title">给二十岁生日的一封信</p>
          <p class="rec-abs">愿你在更远的地方，依然记得此刻的真诚与勇敢。</p>
        </div>
      </div>
      <div class="rec-foot">
        <i></i><span class="st">封存中</span>
        <span class="eta">预计 2027 年夏抵达</span>
      </div>
    </a>

    <a class="letter-card fold rec-card m-rise" href="look.html" aria-label="城南旧书店的雨夜，已抵达">
      <div class="rec-main">
        <span class="rec-ico">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="12" height="13" rx="1"/><path d="M7 7.4h6M7 10.2h6M7 13h3.6"/></svg>
        </span>
        <div>
          <p class="rec-title">城南旧书店的雨夜</p>
          <p class="rec-abs">那天的雨很大，而我在书页里遇见了另一种可能。</p>
        </div>
      </div>
      <div class="rec-foot">
        <span class="st">已抵达 · 320 字</span>
      </div>
    </a>

  </main>

</div>

</body>
</html>
