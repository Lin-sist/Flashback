<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 时间篇章</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<style>
  /* ---- 页级微调：时间篇章（蓝本：概念图/篇章页/V1.png；自述直接排在纸上） ---- */
  .page { position: absolute; inset: 0; padding: 0 var(--page-x); }

  .nav-row { position: relative; margin-top: 54px; height: 30px; display: flex; align-items: center; }
  .back { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); opacity: .85; }
  .back span { font-size: 14px; font-weight: 300; letter-spacing: 0.1em; }

  .ch-head { margin-top: 24px; text-align: center; }
  .ch-title { font-size: 26px; font-weight: 400; letter-spacing: 0.14em; text-indent: 0.14em; color: var(--ink); }
  .ch-pill { display: inline-flex; align-items: center; margin-top: 16px; height: 28px; padding: 0 16px; border: 0.5px solid rgba(107, 101, 96, 0.5); border-radius: var(--radius-pill); font-size: 12px; font-weight: 300; letter-spacing: 0.16em; text-indent: 0.16em; color: var(--ink-mid); }

  .ch-story { margin-top: 26px; font-size: 16.5px; font-weight: 300; line-height: 2.1; letter-spacing: 0.05em; color: var(--ink-mid); }
  .ch-meta { margin-top: 20px; text-align: center; }

  .ch-rec { margin-top: 18px; padding: 20px 22px 20px 26px; display: block; }
  .ch-rec .rec-title { font-size: 17px; font-weight: 400; letter-spacing: 0.06em; color: var(--ink); }
  .ch-rec .rec-abs { margin-top: 10px; font-size: 13.5px; font-weight: 300; line-height: 1.8; letter-spacing: 0.03em; color: var(--ink-mid); }

  /* 底部轻玻璃动作条（浮层语法） */
  .ch-actions {
    position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 6;
    height: 54px; border-radius: var(--radius-sheet);
    background: rgba(250, 247, 242, 0.74);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 0.5px solid rgba(188, 174, 152, 0.35);
    box-shadow: 0 -2px 18px rgba(125, 105, 75, 0.1);
    display: flex; align-items: center;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .ch-actions { background: #F7F2E9; }
  }
  .ch-actions .act { flex: 1; text-align: center; font-size: 14px; font-weight: 300; letter-spacing: 0.18em; text-indent: 0.18em; color: var(--ink-mid); }
  .ch-actions .div { width: 0.5px; height: 20px; background: var(--hairline); }
  .d-1 { --rise-delay: 160ms; }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">

    <header class="nav-row">
      <a class="back" href="records.html" aria-label="返回我的记录">
        <svg width="9" height="16" viewBox="0 0 9 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1L1.5 8L8 15"/></svg>
        <span>返回</span>
      </a>
    </header>

    <section class="ch-head">
      <h1 class="ch-title">在城南的日子</h1>
      <span class="ch-pill">进行中</span>
    </section>

    <p class="ch-story m-rise">那年春天，我常去城南那家旧书店。木质的门推开时，总有一股旧纸与墨香迎面而来。午后的阳光斜斜地落在书架上，浮起细小的尘埃。我在旧书间漫无目的地翻阅，偶尔停下，读上几页，就像在与另一个时代短暂相遇。那些安静的时光，至今仍然温柔地留在记忆里。</p>

    <p class="t-meta-serif ch-meta">始于 二〇二六年春 · 汇集 7 篇此刻</p>

    <a class="letter-card fold ch-rec m-rise d-1" href="look.html" aria-label="城南旧书店的雨夜">
      <p class="rec-title">城南旧书店的雨夜</p>
      <p class="rec-abs">雨声敲在屋檐上，旧书店里格外安静。<br>我靠在窗边，读完了一本很久以前的诗集。</p>
    </a>

    <a class="letter-card fold ch-rec m-rise d-1" href="look.html" aria-label="搬家前夜的花">
      <p class="rec-title">搬家前夜的花</p>
      <p class="rec-abs">那天晚上，我在收拾书的时候，<br>从夹页里发现了一朵干枯的花。</p>
    </a>

  </main>

  <footer class="ch-actions">
    <a class="act" href="writing.html">添加记录</a>
    <span class="div"></span>
    <span class="act">移出</span>
    <span class="div"></span>
    <span class="act">结束篇章</span>
  </footer>

</div>

</body>
</html>
