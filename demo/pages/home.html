<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 首页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<style>
  /* ---- 页级微调：首页（蓝本：概念图/首页/V3.png） ---- */
  .page { position: absolute; inset: 0; padding: 0 var(--page-x); display: flex; flex-direction: column; }

  .brand-row { margin-top: 34px; text-align: center; }

  .hero { margin-top: 60px; text-align: center; }
  .hero-title { line-height: 1.5; }
  .hero-sub { margin-top: 16px; }

  .capture { margin-top: 36px; }
  .capture .viewfinder { height: 132px; }

  /* 信卡紧跟书写位（24–28px），余白留给底部 */
  .cards { margin-top: 26px; display: flex; flex-direction: column; gap: 16px; }

  .card-wait { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 20px 26px; }
  .card-wait .arrive { margin-top: 8px; font-size: 14px; font-weight: 300; letter-spacing: 0.06em; color: var(--ink-mid); }

  .card-recent { padding: 16px 20px 15px 26px; }
  .card-recent .recent-main { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 10px; }
</style>
<script defer src="../assets/demo-store.js"></script>
<script defer src="../assets/demo-flow.js"></script>
</head>
<body class="demo-core" data-page="home">

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">

    <header class="brand-row"><span class="t-brand">时光回序</span></header>

    <section class="hero">
      <h1 class="hero-title"><span class="t-h1a">今天的你，</span><br><span class="t-h1b">想留下些什么？</span></h1>
      <p class="t-sub hero-sub">你写下的此一刻，正等待被未来的你重新读懂</p>
    </section>

    <section class="capture">
      <a class="viewfinder" href="writing.html" aria-label="开始书写测试文字"><span class="viewfinder-ph">此刻，你想留下什么？</span></a>
    </section>

    <section class="cards">
      <article class="letter-card fold card-wait">
        <span class="redline"></span>
        <div>
          <p class="t-section">一封写于 2025 年的信</p>
          <p class="arrive">即将抵达 · 2027 年夏</p>
        </div>
        <span class="seal">待</span>
      </article>

      <article class="letter-card fold card-recent">
        <p class="t-meta-serif">最近抵达 · 时间回看</p>
        <div class="recent-main">
          <p class="t-section">傍晚下过一阵雨</p>
          <a class="tlink" href="look.html">再次读一读 ›</a>
        </div>
      </article>
    </section>

    <section class="home-demo" data-role="home-demo" hidden>
      <p class="t-meta-serif">本标签页留下的文字</p>
      <a href="look.html?demo=latest"><span class="t-section record-title" data-role="home-demo-title"></span> · 回看 ›</a>
    </section>
    <p class="demo-note">本地演示 · 不上传，请只输入测试文字。</p>
    <p class="demo-status" data-role="status" role="status" aria-live="polite"></p>
  </main>

  <nav class="tabbar">
    <span class="tab active" aria-current="page">首页</span>
    <a class="tab" href="timeline.html">时光轴</a>
    <a class="tab" href="user-center.html">个人中心</a>
  </nav>

</div>

</body>
</html>
