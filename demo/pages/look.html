<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 回看</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<link rel="stylesheet" href="../assets/motion-samples.css">
<style>
  /* ---- 页级微调：回看页（蓝本：概念图/回看页/V3.png） ----
     页面可滚动；结构＝信卡（含当时所在）→ 片段（照片+语音）→ 回信卡 → 聊聊链接 → 药丸（随文档流）。 */
  .page {
    position: absolute; inset: 0; padding: 0 var(--page-x) 40px;
    overflow-y: auto;
  }
  .page::-webkit-scrollbar { display: none; }

  .brand-row { position: relative; margin-top: 54px; text-align: center; }
  .close { position: absolute; left: 0; top: -5px; width: 26px; height: 26px; color: var(--ink); opacity: .8; }
  .page .brand-row .t-brand { position: relative; }

  .archive { margin-top: 30px; text-align: center; }
  .archive .a-line { font-size: 13px; font-weight: 300; letter-spacing: 0.2em; color: var(--ink-mid); }
  .archive .a-season { margin-top: 13px; }

  .look-title {
    margin-top: 34px; text-align: center;
    font-size: 32px; font-weight: 400; letter-spacing: 0.1em; color: var(--ink);
  }

  .reader { margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 13px; }
  .reader .reader-text { font-size: 13.5px; font-weight: 300; letter-spacing: 0.1em; color: var(--ink-mid); }

  /* 正文信卡：正文＋卡内底部「当时所在」一行淡墨 */
  .look-card { margin-top: 26px; padding: 26px 24px 20px 28px; }
  .look-card .look-body { font-size: 15.5px; line-height: 2.05; }
  .where { margin-top: 20px; font-size: 10px; font-weight: 300; letter-spacing: 0.12em; color: var(--ink-faint); }

  .fragments { margin-top: 34px; }
  .frag-grid { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .frag-grid figure { position: relative; height: 94px; margin: 0; box-shadow: 0 3px 10px rgba(120, 100, 70, 0.2); }
  .frag-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 首图左上角墨色细线小纸签「封面」 */
  .cover-tag {
    position: absolute; left: 10px; top: 10px; z-index: 2;
    padding: 3px 9px;
    background: rgba(48, 46, 41, 0.85);
    font-size: 10px; font-weight: 300; letter-spacing: 0.22em; text-indent: 0.22em;
    color: #F4EFE5;
  }

  .look-voice { margin-top: 16px; display: flex; align-items: center; gap: 14px; }
  .v-play {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(107, 101, 96, 0.5);
    display: grid; place-items: center;
  }
  .v-play i {
    display: block; margin-left: 2px;
    border-style: solid; border-width: 4.5px 0 4.5px 7px;
    border-color: transparent transparent transparent var(--ink-mid);
  }
  .v-text { font-size: 13.5px; font-weight: 300; letter-spacing: 0.08em; color: var(--ink-mid); }

  /* 回信卡：与主卡同宽、正常 20px 间距；淡占位小字＋两条横线 */
  .reply-card { margin-top: 20px; padding: 20px 22px 24px; }
  .reply-ph { margin-top: 16px; padding-bottom: 11px; border-bottom: 0.5px solid rgba(200, 194, 184, 0.65); font-size: 12.5px; font-weight: 300; letter-spacing: 0.08em; color: var(--ink-faint); }
  .reply-lines { margin-top: 0; }
  .reply-lines i { display: block; height: 1px; background: rgba(200, 194, 184, 0.6); }
  .reply-lines i + i { margin-top: 25px; }

  .chat { margin-top: 30px; text-align: center; }

  /* 底部药丸随文档流，底部留白 40px（.page padding-bottom） */
  .respond { margin-top: 36px; display: flex; justify-content: center; }

  .d-1 { --rise-delay: 120ms; }
  .d-2 { --rise-delay: 260ms; }
  .d-3 { --rise-delay: 420ms; }
</style>
<script defer src="../assets/demo-store.js"></script>
<script defer src="../assets/demo-flow.js"></script>
<script defer src="../assets/motion-samples.js"></script>
</head>
<body class="demo-core demo-motion" data-page="look">

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">

    <header class="brand-row">
      <a class="close" href="timeline.html" aria-label="返回时光轴">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>
      </a>
      <span class="t-brand">时光回序</span>
    </header>

    <p class="demo-status" data-role="status" role="status" aria-live="polite">本地演示 · 当前为固定合成样本。</p>
    <section class="demo-empty" data-role="empty-view" hidden><h2>还没有可回看的演示文字</h2><a class="tlink" href="writing.html">去书写 ›</a></section>
    <div data-role="record-view">
    <section class="archive">
      <p class="a-line" data-role="archive-line">存档第 三〇 号 · 城南旧书店</p>
      <p class="a-line a-season" data-role="archive-season">二〇二六年 · 夏季</p>
    </section>

    <h2 class="look-title record-title" data-role="record-title" tabindex="-1">“那天晚上的风”</h2>

    <div class="reader">
      <span class="seal">阅</span>
      <span class="reader-text" data-role="reader-text">过去的你 · 写于半年前</span>
    </div>

    <div class="paper-scene" data-motion="paper">
      <article class="letter-card fold look-card">
        <span class="redline"></span>
        <p class="t-body look-body record-text" data-role="record-body">搬家前夜，雨下得很大。我把阳台的花一棵一棵搬进屋里，想着明年它们会不会还记得这个阳台。</p>
        <p class="where" data-role="record-where">当时所在 · 城南旧书店，雨夜的灯下</p>
      </article>
      <div class="paper-shadow" aria-hidden="true"></div>
      <div class="paper-turn" aria-hidden="true">
        <div class="paper-leaf">
          <div class="paper-face paper-face-front"><span class="paper-tip"></span></div>
          <div class="paper-face paper-face-back"></div>
        </div>
      </div>
    </div>
    <div class="paper-tools" data-motion="tools" hidden>
      <button class="glass-pill motion-glass paper-replay" data-motion="replay" type="button" hidden><span class="motion-glass-label">再翻开一次</span></button>
    </div>

    <section class="fragments m-rise d-2" data-role="fragments">
      <p class="t-meta-serif">当时留下的片段</p>
      <div class="frag-grid">
        <figure>
          <span class="cover-tag">封面</span>
          <img src="../assets/img/frag-rain.jpg" alt="雨夜窗（合成占位照片）">
        </figure>
        <figure>
          <img src="../assets/img/frag-shop.jpg" alt="城南旧书店暖窗（合成占位照片）">
        </figure>
      </div>
      <div class="look-voice">
        <button class="v-play" disabled aria-label="声音样本仅展示"><i></i></button>
        <span class="v-text">00:18 原始声音 · 仅展示</span>
      </div>
    </section>

    <article class="letter-card fold reply-card m-rise d-3" data-role="reply">
      <p class="t-meta-serif">现在的我 · 后来其实</p>
      <p class="reply-ph">后来的你，想对当时说些什么</p>
      <div class="reply-lines"><i></i><i></i></div>
    </article>

    <div class="chat" data-role="chat"><a class="tlink" href="agent-review.html">和它聊聊那时候</a></div>

    <div class="respond" data-role="respond">
      <button class="glass-pill" disabled aria-label="留下回应仅展示"><span class="dot"></span>留下回应 · 展示</button>
    </div>

    <div class="demo-links" data-role="edit-link" hidden><a class="tlink" href="writing.html">继续补充这条演示文字 ›</a></div>
    </div>
  </main>

</div>

</body>
</html>
