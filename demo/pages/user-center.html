<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 个人中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<style>
  /* ---- 页级微调：个人中心（蓝本：概念图/个人中心/V1.png；三区门厅） ----
     红色配额已满：守印／Tab 点／头像红日，不得再引入。 */
  .page { position: absolute; inset: 0; padding: 0 var(--page-x); }

  .brand-row { margin-top: 30px; text-align: center; }

  /* 区一：身份与保管陈述（抽象墨韵头像，无真人脸） */
  .avatar {
    width: 100px; height: 100px; border-radius: 50%; margin: 24px auto 0;
    background:
      radial-gradient(11px 11px at 64% 28%, rgba(181, 53, 42, 0.72), transparent 72%),
      radial-gradient(36px 28px at 38% 76%, rgba(96, 92, 86, 0.4), transparent 70%),
      radial-gradient(44px 24px at 64% 88%, rgba(116, 110, 102, 0.34), transparent 70%),
      radial-gradient(28px 20px at 28% 92%, rgba(80, 76, 70, 0.3), transparent 70%),
      linear-gradient(200deg, #EFE9DD 0%, #E2DACC 60%, #D6CCBC 100%);
    box-shadow: 0 4px 14px rgba(125, 105, 75, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  .nick { margin-top: 16px; text-align: center; font-size: 22px; font-weight: 400; letter-spacing: 0.2em; text-indent: 0.2em; color: var(--ink); }
  .custody { margin-top: 12px; text-align: center; font-size: 13.5px; font-weight: 300; letter-spacing: 0.05em; color: var(--ink-mid); }

  /* 区二：记录与时间（取景框＝入口语法：描边扁平卡＋四角括线） */
  .entrance {
    --bk: rgba(107, 101, 96, 0.5);
    position: relative; display: flex; align-items: center;
    height: 58px; padding: 0 22px; margin-top: 15px;
    background-color: rgba(252, 249, 244, 0.55);
    border: 0.5px solid var(--hairline); border-radius: var(--radius-card);
    background-image:
      linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)),
      linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)),
      linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)),
      linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk));
    background-repeat: no-repeat;
    background-size: 13px 1px, 1px 13px, 13px 1px, 1px 13px, 13px 1px, 1px 13px, 13px 1px, 1px 13px;
    background-position:
      9px 9px, 9px 9px,
      calc(100% - 22px) 9px, calc(100% - 9px) 9px,
      9px calc(100% - 9px), 9px calc(100% - 22px),
      calc(100% - 22px) calc(100% - 9px), calc(100% - 9px) calc(100% - 22px);
    font-size: 16px; font-weight: 400; letter-spacing: 0.12em; color: var(--ink);
  }

  /* 区三：托管凭证卡（全页唯一视觉重心） */
  .voucher { margin-top: 24px; padding: 22px 22px 20px; display: block; }
  .voucher .v-main { display: flex; align-items: center; gap: 18px; }
  .voucher .seal-lg { flex: none; width: 52px; height: 52px; font-size: 19px; }
  .voucher .v-div { flex: none; width: 0.5px; height: 52px; background: var(--hairline); }
  .voucher .v-title { font-size: 19px; font-weight: 400; letter-spacing: 0.1em; color: var(--ink); }
  .voucher .v-sub { margin-top: 7px; font-size: 12.5px; font-weight: 300; letter-spacing: 0.06em; color: var(--ink-mid); }
  .voucher .v-actions { margin-top: 16px; display: flex; justify-content: flex-end; gap: 12px; }
  .v-btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 19px; border: 0.5px solid rgba(107, 101, 96, 0.5); border-radius: var(--radius-card); font-size: 12.5px; font-weight: 300; letter-spacing: 0.14em; text-indent: 0.14em; color: var(--ink-mid); }

  .about { margin-top: 22px; text-align: center; font-size: 12px; font-weight: 300; letter-spacing: 0.3em; text-indent: 0.3em; color: var(--ink-faint); }

  .d-1 { --rise-delay: 120ms; }
  .d-2 { --rise-delay: 240ms; }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">

    <header class="brand-row"><span class="t-brand">时光回序</span></header>

    <section class="m-rise">
      <figure class="avatar" role="img" aria-label="抽象墨韵头像（合成占位）"></figure>
      <h2 class="nick">山月</h2>
      <p class="custody">这里替你保管着 14 封信，还有 0 封在路上。</p>
    </section>

    <nav class="d-1">
      <a class="entrance" href="records.html">我的记录</a>
      <a class="entrance" href="timeline.html">时间回看</a>
      <a class="entrance" href="summary.html">整理成一封近况</a>
    </nav>

    <a class="letter-card voucher m-rise d-2" href="ownership.html" aria-label="托管凭证：你的数据只属于你">
      <div class="v-main">
        <span class="seal seal-lg">守</span>
        <span class="v-div"></span>
        <div>
          <p class="v-title">托管凭证</p>
          <p class="v-sub">你的数据只属于你</p>
        </div>
      </div>
      <div class="v-actions">
        <span class="v-btn">导出</span>
        <span class="v-btn">清理</span>
      </div>
    </a>

    <p class="about">关于</p>

  </main>

  <nav class="tabbar">
    <a class="tab" href="home.html">首页</a>
    <a class="tab" href="timeline.html">时光轴</a>
    <span class="tab active">个人中心</span>
  </nav>

</div>

</body>
</html>
