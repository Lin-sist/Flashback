<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 这次想怎么聊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<style>
  /* ---- 页级微调：Agent 选择浮层（蓝本：书写页/Agent选择浮层.png）
     结构＝书写页（压暗背景）＋底部选择底板；见证者无头像、无气泡。 ---- */
  .sheet { position: absolute; inset: 0; padding: 0 30px 0 36px; }
  .close { display: block; margin-top: 54px; width: 24px; height: 24px; color: var(--ink); opacity: .8; }
  .dogear {
    position: absolute; top: 8px; right: 0; width: 18px; height: 18px;
    background: linear-gradient(to bottom left, var(--fold-page) 0 50%, var(--fold-shade) 50.5% 100%);
    box-shadow: -2px 2px 3px rgba(120, 100, 70, 0.15);
  }
  .sheet .side-note { position: absolute; right: 16px; top: 118px; }
  .margin-line {
    position: absolute; left: 15px; top: 150px; bottom: 128px; width: 1.5px;
    background: linear-gradient(to bottom, transparent, rgba(181, 53, 42, 0.42) 12% 88%, transparent);
  }
  .lh-date { display: block; margin-top: 20px; font-size: 13px; }
  .w-title { margin-top: 44px; font-size: 28px; font-weight: 400; letter-spacing: 0.1em; color: var(--ink); }
  .w-body { margin-top: 20px; max-width: 305px; }
  .w-photo {
    margin-top: 30px; width: 216px; height: 164px;
    box-shadow: 0 3px 10px rgba(120, 100, 70, 0.2);
    background:
      radial-gradient(3px 3px at 22% 28%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(2px 2px at 40% 60%, rgba(255,255,255,.45), transparent 60%),
      radial-gradient(4px 4px at 60% 35%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(2.5px 2.5px at 72% 70%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(3px 3px at 33% 80%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(2px 2px at 55% 15%, rgba(255,255,255,.45), transparent 60%),
      linear-gradient(90deg, transparent 0 84%, rgba(42, 46, 52, 0.9) 84%),
      linear-gradient(180deg, #7E8896 0%, #9AA0AC 40%, #C4AE94 72%, #7A6A58 100%);
  }

  /* 底部选择底板（浮层语法：纸面底板，微圆顶角） */
  .choose-sheet { padding-bottom: 46px; }
  .opt-grid { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt-card { position: relative; display: block; padding: 30px 12px 34px 24px; background: #FBF8F1; border: 0.5px solid var(--hairline); border-radius: var(--radius-card); box-shadow: 0 3px 10px rgba(125, 105, 75, 0.12); }
  .opt-line { position: absolute; left: 10px; top: 18px; bottom: 18px; width: 1.5px; background: linear-gradient(to bottom, transparent, rgba(181, 53, 42, 0.5) 15% 85%, transparent); }
  .opt-title { font-size: 17px; font-weight: 400; letter-spacing: 0.1em; color: var(--ink); }
  .opt-sub { margin-top: 12px; font-size: 11.5px; font-weight: 300; letter-spacing: 0.02em; color: var(--ink-mid); white-space: nowrap; }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="sheet">
    <span class="dogear"></span>
    <span class="side-note">只写给自己</span>
    <span class="margin-line"></span>
    <button class="close" aria-label="关闭">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>
    </button>
    <span class="lh-date t-meta-serif">记录于 二零二六年 · 暮秋</span>
    <h2 class="w-title">雨停之后</h2>
    <p class="t-body w-body">傍晚下过一阵雨，窗边的风有一点凉。</p>
    <figure class="w-photo" role="img" aria-label="雨后窗面（合成占位图）"></figure>
  </main>

  <span class="veil" aria-hidden="true"></span>

  <section class="chat-sheet choose-sheet m-rise">
    <span class="chat-handle"></span>
    <a class="chat-close" href="writing.html" aria-label="收起">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>
    </a>
    <p class="chat-kicker">这次想怎么聊</p>
    <h2 class="chat-title">由你决定它怎么在场</h2>

    <nav class="opt-grid">
      <a class="opt-card" href="agent-writing.html">
        <span class="opt-line"></span>
        <p class="opt-title">就想说说</p>
        <p class="opt-sub">它安静听着，不打断你</p>
      </a>
      <a class="opt-card" href="agent-writing.html">
        <span class="opt-line"></span>
        <p class="opt-title">理一理</p>
        <p class="opt-sub">帮我把心里的事捋清楚</p>
      </a>
    </nav>
  </section>

</div>

</body>
</html>
