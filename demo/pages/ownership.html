<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashback Demo · 数据与所有权</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<link rel="stylesheet" href="../assets/motion.css">
<style>
  /* ---- 页级微调：数据与所有权（蓝本：概念图/个人中心/数据与所有权.png；信任锚点） ---- */
  .page { position: absolute; inset: 0; padding: 0 var(--page-x); }

  .nav-row { position: relative; margin-top: 54px; height: 30px; display: flex; align-items: center; justify-content: center; }
  .back { position: absolute; left: 0; display: inline-flex; align-items: center; gap: 7px; color: var(--ink); opacity: .85; }
  .back span { font-size: 14px; font-weight: 300; letter-spacing: 0.1em; }
  .nav-title { font-size: 15px; font-weight: 400; letter-spacing: 0.3em; text-indent: 0.3em; color: var(--ink); }

  .custody { margin-top: 52px; text-align: center; font-size: 15.5px; font-weight: 300; letter-spacing: 0.04em; color: var(--ink-mid); }

  /* 托管凭证卡：全页唯一视觉重心（信形态：红线＋折角） */
  .voucher { margin-top: 34px; padding: 30px 26px 30px 30px; }
  .voucher .v-head { display: flex; align-items: flex-start; justify-content: space-between; }
  .voucher .v-title { font-size: 26px; font-weight: 400; letter-spacing: 0.12em; color: var(--ink); }
  .voucher .v-sub { margin-top: 10px; font-size: 13.5px; font-weight: 300; letter-spacing: 0.05em; color: var(--ink-mid); }
  .voucher .seal-lg { flex: none; width: 56px; height: 56px; font-size: 20px; }

  /* 直角括线主按钮（导出离线文件） */
  .export-btn {
    --bk: rgba(107, 101, 96, 0.55);
    position: relative; display: flex; align-items: center; justify-content: center;
    height: 52px; margin: 26px 26px 0 22px;
    border: 0.5px solid rgba(107, 101, 96, 0.5); border-radius: var(--radius-card);
    background-image:
      linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk)),
      linear-gradient(var(--bk), var(--bk)), linear-gradient(var(--bk), var(--bk));
    background-repeat: no-repeat;
    background-size: 13px 1px, 1px 13px, 13px 1px, 1px 13px;
    background-position:
      7px 7px, 7px 7px,
      calc(100% - 20px) 7px, calc(100% - 7px) 7px;
    font-size: 16px; font-weight: 400; letter-spacing: 0.2em; text-indent: 0.2em; color: var(--ink);
  }
  .wipe { display: block; margin: 24px auto 0; font-size: 15px; font-weight: 300; letter-spacing: 0.14em; color: var(--vermilion); }
  .v-note { margin-top: 14px; text-align: center; }

  .build-row { margin-top: 30px; display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 22px; border: 0.5px solid var(--hairline); border-radius: var(--radius-card); background: rgba(252, 249, 244, 0.55); }
  .build-row span { font-size: 15px; font-weight: 300; letter-spacing: 0.1em; color: var(--ink); }
  .build-row svg { color: var(--ink-light); }

  .motto { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 12px; font-weight: 300; letter-spacing: 0.14em; color: var(--ink-light); }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="3" width="3" height="8" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.6a10 10 0 0 1 13 0"/><path d="M4.6 7.4a6.3 6.3 0 0 1 7.8 0"/><circle cx="8.5" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="17.6" height="7.6" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="page">

    <header class="nav-row">
      <a class="back" href="user-center.html" aria-label="返回个人中心">
        <svg width="9" height="16" viewBox="0 0 9 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1L1.5 8L8 15"/></svg>
        <span>返回</span>
      </a>
      <span class="nav-title">数据与所有权</span>
    </header>

    <p class="custody">这里替你保管着 14 封信，还有 0 封在路上。</p>

    <section class="letter-card fold voucher m-rise">
      <span class="redline"></span>
      <div class="v-head">
        <div>
          <h2 class="v-title">托管凭证</h2>
          <p class="v-sub">你的数据只属于你</p>
        </div>
        <span class="seal seal-lg">守</span>
      </div>
      <span class="export-btn">导出离线文件</span>
      <button class="wipe">清理全部数据</button>
      <p class="t-meta v-note">导出文件 24 小时内有效</p>
    </section>

    <div class="build-row m-rise d-1">
      <span>构建信息</span>
      <svg width="7" height="12" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 5-5 5"/></svg>
    </div>

    <p class="motto">时光回序 · 只保管，不拥有</p>

  </main>

</div>

</body>
</html>
