<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>E1 时间篇章研究原型</title>
  <style>
    :root {
      --paper: #f4efe4;
      --paper-2: #fbf8f0;
      --ink: #302d28;
      --muted: #777065;
      --line: #d8cebd;
      --red: #8f352d;
      --red-soft: #ead7d1;
      --green: #536c5b;
      --shadow: 0 18px 52px rgba(59, 46, 31, .13);
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
      color: var(--ink);
      background: #ded8cd;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background:
      radial-gradient(circle at 10% 4%, rgba(255,255,255,.7), transparent 28%),
      linear-gradient(135deg, #dad4c9, #eee9df 55%, #d7d0c4); }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .prototype-shell {
      width: min(100%, 1080px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding-bottom: 116px;
    }
    .prototype-notice {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      background: #2f2c28;
      color: #fffaf0;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: .04em;
    }
    .app-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: end;
      padding: 30px clamp(20px, 5vw, 58px) 22px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow { margin: 0 0 7px; color: var(--red); font: 600 12px/1 system-ui, sans-serif; letter-spacing: .18em; }
    h1 { margin: 0; font-size: clamp(27px, 5vw, 42px); font-weight: 500; letter-spacing: .04em; }
    .header-note { max-width: 350px; margin: 0; color: var(--muted); line-height: 1.65; font-size: 13px; }
    .app-body { padding: 26px clamp(18px, 5vw, 58px); }
    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.45);
      margin-bottom: 22px;
    }
    .segmented button {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 18px;
    }
    .segmented button.active { background: var(--ink); color: white; }
    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin: 0 0 16px;
    }
    .section-head h2 { margin: 0; font-size: 21px; font-weight: 500; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 14px;
      color: var(--ink);
      background: var(--paper-2);
    }
    .btn.primary { border-color: var(--red); color: #fff; background: var(--red); }
    .btn.quiet { background: transparent; }
    .btn.danger { border-color: #bd837b; color: #76271f; background: #fff7f4; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .filter-panel {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.42);
    }
    .filter-block label { display: block; margin-bottom: 7px; color: var(--muted); font: 12px system-ui, sans-serif; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      background: transparent;
      color: var(--muted);
    }
    .chip.active { border-color: var(--red); color: var(--red); background: var(--red-soft); }
    .record-list { display: grid; gap: 10px; }
    .record-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 13px;
      align-items: start;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.55);
    }
    .record-card.selected { border-color: var(--red); box-shadow: inset 3px 0 var(--red); }
    .record-date { min-width: 48px; color: var(--red); font: 700 12px system-ui, sans-serif; }
    .record-title { margin: 0 0 5px; font-size: 16px; font-weight: 600; }
    .record-excerpt { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .record-meta { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
    .tag, .status {
      display: inline-flex;
      border-radius: 999px;
      padding: 4px 8px;
      background: #ece5d8;
      color: #625c52;
      font: 11px system-ui, sans-serif;
    }
    .status { background: #e0e9e2; color: #405647; }
    .select-box { width: 22px; height: 22px; accent-color: var(--red); }
    .empty {
      padding: 44px 20px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      text-align: center;
      color: var(--muted);
    }
    .chapter-groups { display: grid; gap: 24px; }
    .group-label { margin: 0 0 10px; color: var(--muted); font: 700 12px system-ui, sans-serif; letter-spacing: .12em; }
    .chapter-card {
      position: relative;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper-2);
      overflow: hidden;
    }
    .chapter-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--red);
    }
    .chapter-card h3 { margin: 0 0 8px; font-size: 21px; font-weight: 500; }
    .chapter-card p { margin: 0; color: var(--muted); line-height: 1.6; }
    .chapter-stats { display: flex; gap: 14px; flex-wrap: wrap; margin: 14px 0 18px; color: var(--muted); font: 12px system-ui, sans-serif; }
    .detail-hero {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(145deg, #fdf9ef, #eee3d4);
      margin-bottom: 18px;
    }
    .detail-hero h2 { margin: 9px 0; font-size: 29px; font-weight: 500; }
    .detail-hero .chapter-note { max-width: 640px; color: var(--muted); line-height: 1.75; }
    .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .lens-hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 18px;
      margin-bottom: 18px;
    }
    .lens-copy, .lens-control {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.55);
    }
    .lens-copy h2 { margin: 0 0 8px; font-weight: 500; font-size: 26px; }
    .lens-control label { display: block; color: var(--muted); font: 12px system-ui, sans-serif; margin-bottom: 8px; }
    .range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .range-row input, .field {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffdf7;
      padding: 10px;
      color: var(--ink);
    }
    textarea.field { min-height: 86px; resize: vertical; }
    .state-panel {
      margin-top: 22px;
      padding: 14px 16px;
      border: 1px solid #bdb3a3;
      border-radius: 14px;
      background: #e8e1d5;
      font: 12px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #4e493f;
    }
    .state-panel strong { display: block; font-family: system-ui, sans-serif; margin-bottom: 4px; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(36, 31, 27, .45);
    }
    .modal {
      width: min(100%, 470px);
      padding: 24px;
      border-radius: 20px;
      background: var(--paper-2);
      box-shadow: var(--shadow);
    }
    .modal h3 { margin: 0 0 10px; font-size: 22px; }
    .modal p { color: var(--muted); line-height: 1.6; }
    .field-label { display: block; margin: 14px 0 6px; color: var(--muted); font: 12px system-ui, sans-serif; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .switcher {
      position: fixed;
      z-index: 80;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 44px minmax(180px, auto) 44px;
      align-items: center;
      overflow: hidden;
      border-radius: 999px;
      background: #272522;
      color: #fff;
      box-shadow: 0 14px 38px rgba(0,0,0,.28);
      font-family: system-ui, sans-serif;
    }
    .switcher button { height: 48px; border: 0; background: transparent; color: white; font-size: 19px; }
    .switcher button:hover { background: rgba(255,255,255,.1); }
    .switcher-label { padding: 0 12px; text-align: center; font-size: 12px; white-space: nowrap; }
    .toast {
      position: fixed;
      z-index: 70;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 15px;
      border-radius: 999px;
      color: white;
      background: var(--green);
      font: 13px system-ui, sans-serif;
    }
    @media (max-width: 680px) {
      .prototype-shell { width: 100%; }
      .app-header { grid-template-columns: 1fr; padding-top: 24px; }
      .header-note { max-width: none; }
      .filter-panel, .lens-hero { grid-template-columns: 1fr; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .record-card { grid-template-columns: auto 1fr; }
      .record-card > :last-child:not(.select-box) { grid-column: 2; }
      .switcher { grid-template-columns: 42px minmax(160px, auto) 42px; }
    }
  </style>
</head>
<body>
  <main id="prototype" class="prototype-shell" data-testid="prototype-root"></main>
  <div class="switcher" aria-label="原型变体切换器">
    <button type="button" data-testid="variant-prev" aria-label="上一个变体">←</button>
    <div class="switcher-label" data-testid="variant-label"></div>
    <button type="button" data-testid="variant-next" aria-label="下一个变体">→</button>
  </div>
  <script>
    /*
     * THROWAWAY PROTOTYPE
     * Three information-model variants for "我的记录", switchable via ?variant=A|B|C.
     * Synthetic data only. In-memory state only. No network, storage, backend, or production route.
     */
    const VARIANTS = {
      A: '标签与时间范围',
      B: '用户定义的时间篇章',
      C: '轻量“这一段”视图'
    };
    const records = [
      { id: 'r1', iso: '2026-07-04', date: '07.04', title: '第一次去看那间小房子', excerpt: '窗边比想象中亮，楼下有一棵很高的树。', tags: ['搬家'], status: '已留下' },
      { id: 'r2', iso: '2026-07-09', date: '07.09', title: '纸箱堆在客厅', excerpt: '先装走了不常用的书，屋子突然空了一块。', tags: ['搬家', '日常'], status: '已留下' },
      { id: 'r3', iso: '2026-07-15', date: '07.15', title: '夜里重新听了那段录音', excerpt: '原来当时说话这么慢。', tags: ['声音'], status: '已抵达' },
      { id: 'r4', iso: '2026-07-21', date: '07.21', title: '和房东确认最后一天', excerpt: '挂断电话后坐了一会儿，没有立刻收拾。', tags: ['搬家'], status: '封存中' },
      { id: 'r5', iso: '2026-07-28', date: '07.28', title: '课程作业终于交了', excerpt: '没有想象中轻松，但今晚可以先睡觉。', tags: ['学习'], status: '已留下' },
      { id: 'r6', iso: '2026-08-03', date: '08.03', title: '新房间的第一顿早餐', excerpt: '桌子还没到，坐在窗边吃完了面包。', tags: ['搬家', '日常'], status: '已留下' },
      { id: 'r7', iso: '2026-08-08', date: '08.08', title: '傍晚下了一阵雨', excerpt: '窗台边的薄荷闻起来很清。', tags: ['日常'], status: '已留下' },
      { id: 'r8', iso: '2026-08-13', date: '08.13', title: '第一次从新家走去车站', excerpt: '拐错了一次弯，回来时已经记住路了。', tags: ['搬家'], status: '已留下' }
    ];
    const root = document.getElementById('prototype');
    const labels = document.querySelector('[data-testid="variant-label"]');
    let variant = normalizeVariant(new URLSearchParams(location.search).get('variant'));
    let toastTimer = null;
    let state = initialState();

    function normalizeVariant(value) {
      return Object.prototype.hasOwnProperty.call(VARIANTS, value) ? value : 'A';
    }
    function initialState() {
      return {
        filter: '全部',
        span: '全部',
        selecting: false,
        selected: new Set(),
        view: 'records',
        modal: null,
        chapter: null,
        order: 'desc',
        lensStart: '2026-07-04',
        lensEnd: '2026-08-13',
        lensSaved: false,
        lensName: '搬家前后的六周'
      };
    }
    function setVariant(next) {
      variant = normalizeVariant(next);
      state = initialState();
      const url = new URL(location.href);
      url.searchParams.set('variant', variant);
      history.replaceState({}, '', url);
      render();
    }
    function cycle(direction) {
      const keys = Object.keys(VARIANTS);
      const index = keys.indexOf(variant);
      setVariant(keys[(index + direction + keys.length) % keys.length]);
    }
    function showToast(message) {
      const old = document.querySelector('.toast');
      if (old) old.remove();
      clearTimeout(toastTimer);
      const node = document.createElement('div');
      node.className = 'toast';
      node.textContent = message;
      document.body.appendChild(node);
      toastTimer = setTimeout(function () { node.remove(); }, 1800);
    }
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function (char) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char];
      });
    }
    function layout(content, note) {
      return [
        '<div class="prototype-notice"><span>E1 研究原型</span><span>·</span><span>合成材料</span><span>·</span><span>不会真实保存</span></div>',
        '<header class="app-header">',
          '<div><p class="eyebrow">FLASHBACK / 我的记录</p><h1>给此刻一个位置</h1></div>',
          '<p class="header-note">' + escapeHtml(note) + '</p>',
        '</header>',
        '<section class="app-body">' + content + '</section>'
      ].join('');
    }
    function renderRecord(record, options) {
      const selected = state.selected.has(record.id);
      const selectable = options && options.selectable;
      const chapterName = options && options.chapterName;
      return [
        '<article class="record-card' + (selected ? ' selected' : '') + '" data-record-id="' + record.id + '">',
          selectable ? '<input class="select-box" type="checkbox" aria-label="选择' + escapeHtml(record.title) + '" data-action="toggle-record" data-id="' + record.id + '"' + (selected ? ' checked' : '') + '>' : '<div class="record-date">' + record.date + '</div>',
          '<div><h3 class="record-title">' + escapeHtml(record.title) + '</h3><p class="record-excerpt">' + escapeHtml(record.excerpt) + '</p>',
          '<div class="record-meta">' + record.tags.map(function (tag) { return '<span class="tag">' + escapeHtml(tag) + '</span>'; }).join('') + '<span class="status">' + record.status + '</span>' + (chapterName ? '<span class="tag">篇章：' + escapeHtml(chapterName) + '</span>' : '') + '</div></div>',
          selectable ? '<div class="record-date">' + record.date + '</div>' : '',
        '</article>'
      ].join('');
    }
    function renderStatePanel(lines) {
      return '<aside class="state-panel" data-testid="state-panel"><strong>原型状态（仅内存）</strong>' + lines.map(function (line) { return '<div>' + escapeHtml(line) + '</div>'; }).join('') + '</aside>';
    }
    function renderVariantA() {
      let list = records.slice();
      if (state.filter !== '全部') list = list.filter(function (record) { return record.tags.includes(state.filter); });
      if (state.span === '最近六周') list = list.filter(function (record) { return record.iso >= '2026-07-04'; });
      const content = [
        '<div class="segmented"><button class="active" type="button">记录</button><button type="button" disabled>篇章（本变体没有）</button></div>',
        '<div class="section-head"><div><h2>所有片段</h2><p>对照：只使用标签和时间范围找到相关记录</p></div></div>',
        '<div class="filter-panel">',
          '<div class="filter-block"><label>标签</label><div class="chips">',
          ['全部', '搬家', '学习', '日常'].map(function (tag) { return '<button type="button" class="chip' + (state.filter === tag ? ' active' : '') + '" data-action="a-filter" data-value="' + tag + '">' + tag + '</button>'; }).join(''),
          '</div></div>',
          '<div class="filter-block"><label>时间范围</label><div class="chips">',
          ['全部', '最近六周'].map(function (span) { return '<button type="button" class="chip' + (state.span === span ? ' active' : '') + '" data-action="a-span" data-value="' + span + '">' + span + '</button>'; }).join(''),
          '</div></div>',
          '<div class="filter-block"><label>当前结果</label><div><strong>' + list.length + '</strong> 条片段</div></div>',
        '</div>',
        '<div class="record-list">' + list.map(function (record) { return renderRecord(record); }).join('') + '</div>',
        renderStatePanel(['信息模型：无容器', '标签：' + state.filter, '时间：' + state.span, '命中片段：' + list.length])
      ].join('');
      return layout(content, 'A 只回答“能否找到”，不提供命名、结束或重新打开一段生活的容器。');
    }
    function renderTabs() {
      return '<div class="segmented"><button type="button" data-action="b-tab-records" class="' + (state.view === 'records' ? 'active' : '') + '">记录</button><button type="button" data-action="b-tab-chapters" class="' + (state.view === 'chapters' || state.view === 'detail' ? 'active' : '') + '">篇章</button></div>';
    }
    function renderVariantB() {
      let body = renderTabs();
      if (state.view === 'records') body += renderBRecords();
      if (state.view === 'chapters') body += renderBChapters();
      if (state.view === 'detail') body += renderBDetail();
      body += renderBModal();
      return layout(body, 'B 让片段先独立成立，再由用户主动组成、结束和重新打开篇章。');
    }
    function renderBRecords() {
      const selectedCount = state.selected.size;
      return [
        '<div class="section-head"><div><h2>所有片段</h2><p>片段默认不属于任何篇章</p></div><div class="toolbar">',
        '<button type="button" class="btn quiet" data-action="b-toggle-select">' + (state.selecting ? '取消选择' : '选择片段') + '</button>',
        state.selecting ? '<button type="button" class="btn primary" data-testid="b-create-chapter" data-action="b-open-create" ' + (selectedCount ? '' : 'disabled') + '>组成篇章（' + selectedCount + '）</button>' : '',
        '</div></div>',
        '<div class="record-list">' + records.map(function (record) {
          const inChapter = state.chapter && state.chapter.members.includes(record.id);
          return renderRecord(record, { selectable: state.selecting, chapterName: inChapter ? state.chapter.name : '' });
        }).join('') + '</div>',
        renderStatePanel(['信息模型：显式容器', '选择模式：' + (state.selecting ? '开启' : '关闭'), '已选择：' + selectedCount, '篇章：' + (state.chapter ? state.chapter.name : '尚未创建')])
      ].join('');
    }
    function renderBChapters() {
      if (!state.chapter) {
        return [
          '<div class="section-head"><div><h2>时间篇章</h2><p>由已经留下的片段生长出来</p></div></div>',
          '<div class="empty"><p>还没有篇章</p><p>回到“记录”，从至少一条完整片段发起。</p><button type="button" class="btn" data-action="b-tab-records">去选择片段</button></div>',
          renderStatePanel(['篇章数量：0', '空篇章创建：不允许'])
        ].join('');
      }
      const chapter = state.chapter;
      const memberRecords = records.filter(function (record) { return chapter.members.includes(record.id); });
      return [
        '<div class="section-head"><div><h2>时间篇章</h2><p>进行中优先；名称可以重复</p></div></div>',
        '<div class="chapter-groups"><section><p class="group-label">' + (chapter.status === '进行中' ? '进行中' : '已结束') + '</p>',
        '<article class="chapter-card"><h3>' + escapeHtml(chapter.name) + '</h3><p>' + escapeHtml(chapter.note || '没有填写自述') + '</p>',
        '<div class="chapter-stats"><span>' + memberRecords.length + ' 条片段</span><span>片段覆盖 07.04—08.13</span><span>' + chapter.status + '</span></div>',
        '<button type="button" class="btn primary" data-testid="b-open-chapter" data-action="b-open-detail">打开篇章</button></article>',
        '</section></div>',
        renderStatePanel(['篇章：' + chapter.name, '状态：' + chapter.status, '成员：' + memberRecords.length, '自动归入：关闭'])
      ].join('');
    }
    function renderBDetail() {
      const chapter = state.chapter;
      if (!chapter) {
        state.view = 'chapters';
        return renderBChapters();
      }
      const memberRecords = records.filter(function (record) { return chapter.members.includes(record.id); });
      const ordered = memberRecords.slice().sort(function (a, b) {
        return state.order === 'desc' ? b.iso.localeCompare(a.iso) : a.iso.localeCompare(b.iso);
      });
      return [
        '<button type="button" class="btn quiet" data-action="b-tab-chapters">← 返回篇章</button>',
        '<section class="detail-hero"><span class="status">' + chapter.status + '</span><h2>' + escapeHtml(chapter.name) + '</h2>',
        '<p class="chapter-note">' + escapeHtml(chapter.note || '没有填写自述') + '</p>',
        '<div class="chapter-stats"><span>' + memberRecords.length + ' 条片段</span><span>片段覆盖时间 07.04—08.13</span>' + (chapter.status === '已结束' ? '<span>当前结束时间 2026.08.28</span>' : '') + '</div>',
        '<div class="detail-actions">',
        chapter.status === '进行中' ? '<button type="button" class="btn" data-testid="b-end-chapter" data-action="b-end">结束篇章</button>' : '<button type="button" class="btn primary" data-testid="b-reopen-chapter" data-action="b-reopen">重新打开</button>',
        '<button type="button" class="btn" data-action="b-toggle-order">时间' + (state.order === 'desc' ? '倒序' : '正序') + '</button>',
        '<button type="button" class="btn danger" data-testid="b-delete-chapter" data-action="b-open-delete">删除篇章</button>',
        '</div></section>',
        '<div class="section-head"><div><h2>篇章中的片段</h2><p>归属变化不修改片段本身</p></div></div>',
        '<div class="record-list">' + (ordered.length ? ordered.map(function (record) { return renderRecord(record, { chapterName: chapter.name }); }).join('') : '<div class="empty">暂时没有片段</div>') + '</div>',
        renderStatePanel(['篇章 ID：chapter-synthetic-01', '状态：' + chapter.status, '成员：' + memberRecords.length, '排序：' + state.order, 'Agent：无'])
      ].join('');
    }
    function renderBModal() {
      if (!state.modal) return '';
      if (state.modal === 'create') {
        return [
          '<div class="modal-backdrop"><div class="modal" role="dialog" aria-label="组成篇章">',
          '<h3>组成篇章</h3><p>已选择 ' + state.selected.size + ' 条完整片段。创建后仍可主动加入未来片段。</p>',
          '<label class="field-label" for="chapter-name">名称（必填）</label><input id="chapter-name" data-testid="chapter-name" class="field" value="搬家前后的六周">',
          '<label class="field-label" for="chapter-note">我的自述（可选）</label><textarea id="chapter-note" data-testid="chapter-note" class="field">不是为了总结搬家，只是想把这段还在发生的生活放在一起。</textarea>',
          '<div class="modal-actions"><button type="button" class="btn" data-action="b-close-modal">取消</button><button type="button" class="btn primary" data-testid="b-confirm-create" data-action="b-confirm-create">创建篇章</button></div>',
          '</div></div>'
        ].join('');
      }
      if (state.modal === 'delete') {
        return [
          '<div class="modal-backdrop"><div class="modal" role="dialog" aria-label="删除篇章">',
          '<h3>只删除篇章？</h3><p>将删除“' + escapeHtml(state.chapter.name) + '”及其 ' + state.chapter.members.length + ' 条归属关系。所有记录都会完整保留，并恢复为不属于任何篇章。</p>',
          '<div class="modal-actions"><button type="button" class="btn" data-action="b-close-modal">取消</button><button type="button" class="btn danger" data-testid="b-confirm-delete" data-action="b-confirm-delete">只删除篇章，不删除记录</button></div>',
          '</div></div>'
        ].join('');
      }
      return '';
    }
    function renderVariantC() {
      const list = records.filter(function (record) { return record.iso >= state.lensStart && record.iso <= state.lensEnd; });
      const content = [
        '<div class="segmented"><button class="active" type="button">记录</button><button type="button" disabled>这一段（研究变体）</button></div>',
        '<div class="lens-hero">',
          '<section class="lens-copy"><p class="eyebrow">轻量时间视图</p><h2>' + escapeHtml(state.lensName) + '</h2><p>它只保存一个浏览范围，不拥有片段，也没有“进行中 / 已结束”。</p>',
          state.lensSaved ? '<div class="chapter-stats"><span>已保存视图</span><span>' + list.length + ' 条匹配</span></div><button type="button" class="btn danger" data-testid="c-delete-view" data-action="c-delete-view">删除这个视图</button>' : '',
          '</section>',
          '<section class="lens-control"><label>片段时间范围</label><div class="range-row"><input type="date" data-action="c-start" value="' + state.lensStart + '"><input type="date" data-action="c-end" value="' + state.lensEnd + '"></div>',
          '<label>我的称呼（可选）</label><input class="field" data-action="c-name" value="' + escapeHtml(state.lensName) + '">',
          '<div style="margin-top:12px"><button type="button" class="btn primary" data-testid="c-save-view" data-action="c-save-view">' + (state.lensSaved ? '更新这个视图' : '保存这个视图') + '</button></div></section>',
        '</div>',
        '<div class="section-head"><div><h2>范围内的片段</h2><p>按日期自动出现，不建立成员关系</p></div><strong>' + list.length + ' 条</strong></div>',
        '<div class="record-list">' + list.map(function (record) { return renderRecord(record); }).join('') + '</div>',
        renderStatePanel(['信息模型：可保存的时间筛选', '拥有片段：否', '范围：' + state.lensStart + '—' + state.lensEnd, '已保存：' + (state.lensSaved ? '是' : '否')])
      ].join('');
      return layout(content, 'C 测试用户是否只需要一个可命名的时间视图，而不是拥有成员和生命周期的容器。');
    }
    function render() {
      labels.textContent = variant + ' — ' + VARIANTS[variant];
      root.innerHTML = variant === 'A' ? renderVariantA() : (variant === 'B' ? renderVariantB() : renderVariantC());
    }
    root.addEventListener('click', function (event) {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'a-filter') state.filter = target.dataset.value;
      if (action === 'a-span') state.span = target.dataset.value;
      if (action === 'b-tab-records') state.view = 'records';
      if (action === 'b-tab-chapters') state.view = 'chapters';
      if (action === 'b-toggle-select') {
        state.selecting = !state.selecting;
        if (!state.selecting) state.selected.clear();
      }
      if (action === 'toggle-record') {
        const id = target.dataset.id;
        if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
      }
      if (action === 'b-open-create' && state.selected.size) state.modal = 'create';
      if (action === 'b-close-modal') state.modal = null;
      if (action === 'b-confirm-create') {
        const name = document.querySelector('[data-testid="chapter-name"]').value.trim();
        const note = document.querySelector('[data-testid="chapter-note"]').value.trim();
        if (!name) { showToast('请先写下篇章名称'); return; }
        state.chapter = { name: name, note: note, status: '进行中', members: Array.from(state.selected) };
        state.selected.clear();
        state.selecting = false;
        state.modal = null;
        state.view = 'chapters';
        showToast('原型状态：篇章已组成');
      }
      if (action === 'b-open-detail') state.view = 'detail';
      if (action === 'b-end') { state.chapter.status = '已结束'; showToast('原型状态：篇章已结束'); }
      if (action === 'b-reopen') { state.chapter.status = '进行中'; showToast('原型状态：篇章已重新打开'); }
      if (action === 'b-toggle-order') state.order = state.order === 'desc' ? 'asc' : 'desc';
      if (action === 'b-open-delete') state.modal = 'delete';
      if (action === 'b-confirm-delete') {
        state.chapter = null;
        state.modal = null;
        state.view = 'chapters';
        showToast('原型状态：只删除了篇章');
      }
      if (action === 'c-save-view') { state.lensSaved = true; showToast('原型状态：时间视图已保存'); }
      if (action === 'c-delete-view') { state.lensSaved = false; showToast('原型状态：时间视图已删除，片段仍在'); }
      render();
    });
    root.addEventListener('change', function (event) {
      const action = event.target.dataset.action;
      if (action === 'c-start') state.lensStart = event.target.value;
      if (action === 'c-end') state.lensEnd = event.target.value;
      if (action === 'c-name') state.lensName = event.target.value;
      render();
    });
    document.querySelector('[data-testid="variant-prev"]').addEventListener('click', function () { cycle(-1); });
    document.querySelector('[data-testid="variant-next"]').addEventListener('click', function () { cycle(1); });
    document.addEventListener('keydown', function (event) {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
    });
    render();
  </script>
</body>
</html>
